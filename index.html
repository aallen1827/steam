
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Terraforming Mars</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="/images/icon.ico">
    <script src="script.js" defer></script>
    <script src="scriptWard.js" defer></script>
</head>

<body>
    <main>

        <!-- MAIN GAME LAYOUT -->
        <div id="gameLayout">

            <!-- LEFT COLUMN -->
            <div id="gameArea">

                <!-- RESOURCES -->
                <section id="resourcePanel">
                    <div id="resourceBar"></div>
                    <div id="steam"></div>
                </section>

                <!-- GAME GRID -->
                <div id="map">
                    <div class="tile" id="tile1" data-tile-id="0"></div>
                    <div class="tile" id="tile2" data-tile-id="1"></div>
                    <div class="tile" id="tile3" data-tile-id="2"></div>
                    <div class="tile" id="tile4" data-tile-id="3"></div>
                    <div class="tile" id="tile5" data-tile-id="4"></div>

                    <div class="tile" id="tile6" data-tile-id="5"></div>
                    <div class="tile" id="tile7" data-tile-id="6"></div>
                    <div class="tile" id="tile8" data-tile-id="7"></div>
                    <div class="tile" id="tile9" data-tile-id="8"></div>
                    <div class="tile" id="tile10" data-tile-id="9"></div>

                    <div class="tile" id="tile11" data-tile-id="10"></div>
                    <div class="tile" id="tile12" data-tile-id="11"></div>
                    <div class="tile" id="tile13" data-tile-id="12"></div>
                    <div class="tile" id="tile14" data-tile-id="13"></div>
                    <div class="tile" id="tile15" data-tile-id="14"></div>

                    <div class="tile" id="tile16" data-tile-id="15"></div>
                    <div class="tile" id="tile17" data-tile-id="16"></div>
                    <div class="tile" id="tile18" data-tile-id="17"></div>
                    <div class="tile" id="tile19" data-tile-id="18"></div>
                    <div class="tile" id="tile20" data-tile-id="19"></div>
                </div>

            </div>

            <!-- RIGHT COLUMN -->
            <aside id="gameSidebar">

                <!-- STAGE INFORMATION -->
                <section id="stagePanel" class="info-panel">
                    <div id="stageDisplay"></div>
                </section>

                <!-- RESOURCE MANAGEMENT BUTTON -->
                <button id="resourceButton" class="sidebar-button">
                    Warehouse Storage
                </button>

                <!-- STEAM MANAGEMENT BUTTON -->
                <button id="steamButton" class="sidebar-button">
                    Valve Control
                </button>

                <!-- MACHINE SHOP BUTTON -->
                <div id="buttons">
                    <button id="buy" class="sidebar-button">
                        Shop
                    </button>
                </div>

                <!-- TERRAFORMING PROGRESS -->
                <section id="terraformPanel" class="info-panel">
                    <div id="terraformProgress"></div>
                </section>

            </aside>

        </div>

        <!-- POPUP MENUS -->

        <!-- RESOURCE MENU -->
        <div id="resourceMenu" class="shop-menu" hidden>
            <div class="shop-header">
                <h2>Warehouse Storage</h2>
                <button id="closeResource">Close</button>
            </div>

            <h3>Manage Resources</h3>
            <p id="storageInfo"></p>

            <h3>Discard Resources</h3>

            <div class="resource-options">
                <button id="water">Discard 10 Water</button>
                <button id="ore">Discard 10 Ore</button>
                <button id="metal">Discard 10 Metal</button>
                <button id="oxygen">Discard 10 Oxygen</button>
            </div>
        </div>

        <!-- STEAM MENU -->
        <div id="steamMenu" class="shop-menu" hidden>
            <div class="shop-header">
                <h2>Valve Control</h2>
                <button id="closeSteam">Close</button>
            </div>

            <p id="steamDisplay"></p>

            <div id="steamControls"></div>
        </div>

        <!-- MACHINE SHOP -->
        <div id="shopMenu" class="shop-menu" hidden>
            <div class="shop-header">
                <h2>Machine Shop</h2>
                <button id="closeShop">Close</button>
            </div>

            <div id="shopItems" class="shop-items"></div>
        </div>

        <!-- TILE ACTION MENU -->
        <div class="tile-menu-popup" id="tile-menu-popup">
            <button id="toggle-production-button" data-action="toggle-production">Stop Production</button>
            <button data-action="remove">Remove</button>
            <button data-action="close">Close Menu</button>
        </div>

        <!-- UNPLACED MACHINE MENU -->
        <div class="tile-menu-popup" id="unplaced-machine-menu">
            <h3>Place Machine</h3>
            <div id="unplaced-machine-list"></div>
        </div>

        <!-- GAME ALERT -->
        <div id="gameAlert" class="game-alert" hidden>
            <div class="alert-content">
                <h2 id="alertTitle"></h2>
                <p id="alertMessage"></p>
                <img id="alertImage" hidden alt="Game image">
                <button id="alertClose">Continue</button>
            </div>
        </div>

    </main>
</body>
</html>
