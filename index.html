<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Terraforming Mars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="scriptWard.js" defer></script>
</head>
<body>
    <header>

    </header>
    <main>
        <div id="stageDisplay"></div>
        <div id="resourceBar"></div>
        <div id="steam"></div>

        <button id="resourceButton">Manage Resources</button>
        <div id="resourceMenu" style="display: none;">
            <h2>Resource Allocation</h2>
            <p>Drop:</p>
            <button id="water">Water</button>
            <button id="ore">Ore</button>
            <button id="metal">Metal</button>
            <button id="oxygen">Oxygen</button>
            <button id="closeResource">Close</button>
        </div>
        
        <button id="steamButton">Manage Steam</button>

        <div id="steamMenu" style="display: none;">
            <h2>Steam Allocation</h2>
            <p id="steamDisplay"></p>
            <div id="steamControls"></div>
            <button id="closeSteam">Close</button>
        </div>
        
        <div id="buttons">
            <button id="buy">Buy Ice Harvester for 10 Water</button>
        </div>
        <div id="terraformProgress"></div>
        <div id="map">
            <div class="tile" id="tile1">
                <p></p>
            </div>
            <div class="tile" id="tile2"></div>
            <div class="tile" id="tile3"></div>
            <div class="tile" id="tile4"></div>
            <div class="tile" id="tile5"></div>
            <div class="tile" id="tile6"></div>
            <div class="tile" id="tile7"></div>
            <div class="tile" id="tile8"></div>
            <div class="tile" id="tile9"></div>
            <div class="tile" id="tile10"></div>
            <div class="tile" id="tile11"></div>
            <div class="tile" id="tile12"></div>
            <div class="tile" id="tile13"></div>
            <div class="tile" id="tile14"></div>
            <div class="tile" id="tile15"></div>
            <div class="tile" id="tile16"></div>
            <div class="tile" id="tile17"></div>
            <div class="tile" id="tile18"></div>
            <div class="tile" id="tile19"></div>
            <div class="tile" id="tile20"></div>
        </div>
        <div class="tile-menu-popup" id="tile-menu-popup">
            <button>Upgrade</button>
            <button>place</button>
            <button>remove</button>
            <button>close menu</button>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
