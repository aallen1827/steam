<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Terraforming Mars</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="scriptWard.js" defer></script>
</head>
<body>
    <header>

    </header>
    <main>
        <div id="stageDisplay"></div>
        <div id="resourceBar"></div>
        <div id="steam"></div>

        <button id="resourceButton">Manage Resources</button>
        <div id="resourceMenu" style="display: none;">
            <h2>Resource Allocation</h2>
            <p>Drop:</p>
            <button id="water">Water</button>
            <button id="ore">Ore</button>
            <button id="metal">Metal</button>
            <button id="oxygen">Oxygen</button>
            <button id="closeResource">Close</button>
        </div>
        
        <button id="steamButton">Manage Steam</button>

        <div id="steamMenu" style="display: none;">
            <h2>Steam Allocation</h2>
            <p id="steamDisplay"></p>
            <div id="steamControls"></div>
            <button id="closeSteam">Close</button>
        </div>
        
        <div id="buttons">
            <button id="buy">Open Shop</button>
        </div>
        
        <div id="shopMenu" class="shop-menu" hidden>
            <div class="shop-header">
                <h2>Machine Shop</h2>
                <button id="closeShop">Close</button>
            </div>

            <div id="shopItems" class="shop-items"></div>
        </div>

        <div id="terraformProgress"></div>
        <div id="map">
            <div class="tile" id="tile1" data-tile-id="0"></div>
            <div class="tile" id="tile2" data-tile-id="1"></div>
            <div class="tile" id="tile3" data-tile-id="2"></div>
            <div class="tile" id="tile4" data-tile-id="3"></div>
            <div class="tile" id="tile5" data-tile-id="4"></div>
            <div class="tile" id="tile6" data-tile-id="5"></div>
            <div class="tile" id="tile7" data-tile-id="6"></div>
            <div class="tile" id="tile8" data-tile-id="7"></div>
            <div class="tile" id="tile9" data-tile-id="8"></div>
            <div class="tile" id="tile10" data-tile-id="9"></div>
            <div class="tile" id="tile11" data-tile-id="10"></div>
            <div class="tile" id="tile12" data-tile-id="11"></div>
            <div class="tile" id="tile13" data-tile-id="12"></div>
            <div class="tile" id="tile14" data-tile-id="13"></div>
            <div class="tile" id="tile15" data-tile-id="14"></div>
            <div class="tile" id="tile16" data-tile-id="15"></div>
            <div class="tile" id="tile17" data-tile-id="16"></div>
            <div class="tile" id="tile18" data-tile-id="17"></div>
            <div class="tile" id="tile19" data-tile-id="18"></div>
            <div class="tile" id="tile20" data-tile-id="19"></div>
        </div>
        <div class="tile-menu-popup" id="tile-menu-popup">
            <button data-action="upgrade">upgrade</button>
            <button data-action="place">place</button>
            <button data-action="remove">remove</button>
            <button data-action="close">close menu</button>
        </div>
        <div class="tile-menu-popup" id="unplaced-machine-menu">
            <h3>Place Machine</h3>

            <div id="unplaced-machine-list"></div>
        <div id="gameAlert" class="game-alert" hidden>
            <div class="alert-content">
                <h2 id="alertTitle"></h2>
                <p id="alertMessage"></p>
                <button id="alertClose">Continue</button>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
